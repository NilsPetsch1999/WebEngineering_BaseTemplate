version: "3.9"

services:
  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: http://backend:8080
    depends_on:
      - backend
